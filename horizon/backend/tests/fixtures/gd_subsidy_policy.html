<h1>关于做好中小微企业贷款贴息工作的通知</h1>
<p>粤财金〔2026〕12号</p>
<p>各地级以上市财政局、地方金融管理部门，各有关金融机构：</p>
<p>一、贴息对象。对符合条件的制造业中小微企业贷款，按不超过 LPR 的 30% 给予贴息，单个企业年度贴息金额最高 500 万元。</p>
<p>二、适用范围。本通知适用于广东省内依法设立的政策性银行、国有大型商业银行、股份制商业银行、城市商业银行、农村商业银行及村镇银行。</p>
<p>三、经办银行。贴息资金通过上述经办银行直接抵扣企业应付利息，企业无需另行申报。</p>
<p>四、执行期限。自 2026 年 11 月 1 日起执行，至 2026 年 12 月 31 日止。</p>
