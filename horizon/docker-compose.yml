services:
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/horizon.db}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    ports:
      - "8000:8000"
    volumes:
      - horizon-data:/data
      - ./seed:/seed:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://api:8000/api/v1
    environment:
      NEXT_PUBLIC_API_BASE: http://api:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

  # 可选：云端同构 PostgreSQL + pgvector（本地默认 SQLite，不影响启动）
  db:
    image: pgvector/pgvector:pg16
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: horizon
      POSTGRES_PASSWORD: horizon
      POSTGRES_DB: horizon
    ports:
      - "5432:5432"
    volumes:
      - horizon-pg:/var/lib/postgresql/data

  # 可选：本地模型
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - horizon-ollama:/root/.ollama

volumes:
  horizon-data:
  horizon-pg:
  horizon-ollama:
