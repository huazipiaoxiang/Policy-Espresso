# HORIZON 生产反代（10 §2）：443 → web；/api → api（仅内网可达由安全组保证）
server {
    listen 443 ssl;
    server_name horizon.internal.example.com;

    ssl_certificate     /etc/nginx/certs/horizon.crt;
    ssl_certificate_key /etc/nginx/certs/horizon.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # BFF 代理走 Next（/api/proxy/...）：由 Next 服务端注入 X-API-Key 后转发到后端，
    # 避免 API Key 暴露到浏览器包。前缀最长匹配优先于下面的 /api/。
    location /api/proxy/ {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;   # 分析任务同步执行，放宽超时
    }

    location /stream/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_buffering off;       # SSE 必须关缓冲
        proxy_set_header Connection "";
    }
}
